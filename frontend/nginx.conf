server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Todo lo que empieza con /api/ se reenvia al servicio "api" de compose
    # (el prefijo /api se saca: /api/predict -> http://api:8000/predict)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
