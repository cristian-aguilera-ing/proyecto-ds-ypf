name: prediccion-neuquina

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: prediccion-neuquina-api:1.0
    ports:
      - "8000:8000"
    # Tope de memoria: la API usa ~470 MB con un worker; si algo se dispara, Docker la reinicia
    # en lugar de afectar al resto de la máquina
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: prediccion-neuquina-frontend:1.0
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Presentación del proyecto: http://localhost:8090 (no depende de la API)
  presentacion:
    build:
      context: .
      dockerfile: docker/presentacion.Dockerfile
    image: prediccion-neuquina-presentacion:1.0
    ports:
      - "8090:80"
    restart: unless-stopped

  # Control remoto de la presentación (notas + siguiente/anterior): se accede por el puerto 8090
  # (nginx reenvía /control-api/). La clave sale de CONTROL_CLAVE; si no se define, se genera una
  # y queda en el log: docker compose logs control
  control:
    build:
      context: .
      dockerfile: docker/control.Dockerfile
    image: prediccion-neuquina-control:1.0
    environment:
      CONTROL_CLAVE: ${CONTROL_CLAVE:-}
    deploy:
      resources:
        limits:
          memory: 64m
    restart: unless-stopped

  # Túnel a internet para que los compañeros se conecten desde afuera de la red:
  #   docker compose --profile tunel up -d tunel
  #   docker compose logs tunel 2>&1 | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | tail -1
  # Para apagarlo hay que usar --profile tunel (un "down" común no lo elimina): docker compose --profile tunel down
  tunel:
    profiles: ["tunel"]
    image: cloudflare/cloudflared:2025.9.1
    command: tunnel --no-autoupdate --url http://presentacion:80
    depends_on: [presentacion]
    restart: unless-stopped

  # Reentrenamiento dentro de un contenedor: docker compose --profile train run --rm train
  train:
    profiles: ["train"]
    image: python:3.14-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "pip install -q -r requirements.txt && pip install -q -e . &&
             python -m ypf_ds.data.clean && python -m ypf_ds.models.train --sin-mlflow"
