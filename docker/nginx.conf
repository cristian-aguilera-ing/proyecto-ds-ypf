server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El frontend llama a /api/... y nginx lo reenvía al contenedor de la API
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        # Sin caché: el navegador revalida y siempre toma la última versión del frontend
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
