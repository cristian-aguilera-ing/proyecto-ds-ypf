server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Control remoto (long polling): nginx lo reenvía al servicio "control". Se resuelve en cada pedido
    # (resolver de Docker + variable) para que la presentación arranque aunque ese servicio no esté.
    location /control-api/ {
        resolver 127.0.0.11 valid=10s;
        set $control http://control:8091;
        rewrite ^/control-api/(.*)$ /$1 break;
        proxy_pass $control;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        # Sin caché heurística: cada cambio del guion o de las escenas se ve al recargar
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
